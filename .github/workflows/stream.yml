name: 24-7 Free Stream Engine

on:
  repository_dispatch:
    types: [start_stream]
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install FFMPEG and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg jq
        pip install yt-dlp

    - name: Start Live Stream
      run: |
        echo "Streaming directly using Lovable inputs..."
        
        # Get Key and URL from Lovable button dispatch
        STREAM_KEY="${{ github.event.client_payload.stream_key }}"
        VIDEO_URL="${{ github.event.client_payload.video_url }}"
        
        echo "Downloading video content..."
        yt-dlp --no-check-certificate -f mp4 "$VIDEO_URL" -o video.mp4 || wget -O video.mp4 "$VIDEO_URL"
        
        echo "Streaming to YouTube..."
        ffmpeg -re -stream_loop -1 -i video.mp4 -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
