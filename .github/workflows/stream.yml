name: 24-7 Free Stream Engine

on:
  repository_dispatch:
    types: [start_stream, start-stream, stop_stream, stop-stream]
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Type START or STOP'
        required: false
        default: 'START'
      video_url:
        description: 'Google Drive Video Direct Link (Only for START)'
        required: false
        default: ''
      stream_key:
        description: 'YouTube Stream Key (Only for START)'
        required: false
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Check If Website Sent STOP Signal
      run: |
        echo "Checking action trigger..."
        
        # Determine if it is a stop request from website or manual input
        TRIGGER_TYPE="${{ github.event.action }}"
        MANUAL_TYPE="${{ github.event.inputs.action_type }}"
        
        if [ "$TRIGGER_TYPE" = "stop_stream" ] || [ "$TRIGGER_TYPE" = "stop-stream" ] || [ "$MANUAL_TYPE" = "STOP" ]; then
          echo "⚠️ STOP SIGNAL RECEIVED FROM WEBSITE! Cancelling active streams..."
          
          # This API call will find any currently running stream workflow and cancel it automatically
          ACTIVE_RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/stream.yml/runs?status=in_progress" \
            | jq '.workflow_runs[].id')
          
          for RUN_ID in $ACTIVE_RUNS; do
            if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
              echo "Cancelling running workflow ID: $RUN_ID"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel"
            fi
          done
          
          echo "All other active streams stopped successfully. Exiting this trigger."
          exit 0
        fi

    - name: Install FFMPEG and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg jq
        pip install yt-dlp

    - name: Start Live Stream
      run: |
        echo "Processing Stream Configuration..."
        
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          VIDEO_URL="${{ github.event.client_payload.video_url }}"
          STREAM_KEY="${{ github.event.client_payload.stream_key }}"
        else
          VIDEO_URL="${{ github.event.inputs.video_url }}"
          STREAM_KEY="${{ github.event.inputs.stream_key }}"
        fi

        if [ -z "$VIDEO_URL" ] || [ -z "$STREAM_KEY" ]; then
          echo "ERROR: Video URL or Stream Key is empty!"
          exit 1
        fi
        
        echo "Downloading video content..."
        yt-dlp --no-check-certificate -f mp4 "$VIDEO_URL" -o video.mp4 || wget -O video.mp4 "$VIDEO_URL"
        
        echo "Streaming directly to YouTube (Bypassing Dashboard)..."
        ffmpeg -re -stream_loop -1 -i video.mp4 -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY?bandwidthtest=false"
